# Local development services. Reads POSTGRES_* from the root .env (docker compose loads it automatically).
#   docker compose -f compose.dev.yaml up -d postgres
name: projectu-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectu}
      POSTGRES_USER: ${POSTGRES_USER:-projectu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: the database is never reachable from the network.
      - '127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432'
    volumes:
      # postgres:18 keeps data in a versioned subdirectory of /var/lib/postgresql.
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata-dev:
